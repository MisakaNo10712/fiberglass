# ========================================
# 训练配置
# ========================================
# 面向光纤路径序列 -> 基函数系数回归的完整训练配置。

seed: 42

# 设备: "auto" | "cpu" | "cuda"
device: "auto"

# 数据配置
data:
  manifest: "project/data/processed2/manifest.json"
  samples_dir: "project/data/processed2"
  use_dataframe: false
  coord_scale: 1.0
  kappa_meas_scale: 1.0

# Dataset stats path (global stats for kappa/w)
stats_path: "project/data/processed2/stats.json"

# 模型配置
model:
  in_features: 5
  d_model: 128
  n_layers: 4
  dropout: 0.0
  out_coeffs: 16
  encoder_type: "auto"

# 基函数配置
basis:
  M: 4
  N: 4
  Lx: 0.3
  Ly: 1.0

# 训练超参数
train:
  batch_size: 8
  epochs: 100
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0

# 损失权重
loss:
  # huber_delta is applied in normalized space (after / std).
  huber_delta: 1.0
  lambda_kappa: 1.0
  lambda_hf: 0.0
  lambda_w: 1.0
  lambda_bc: 0.0
  log_every_n: 100

# Curriculum config (optional)
curriculum:
  enabled: true
  stageA_steps: 1000
  stageB_warmup_steps: 2000

# 运行输出
run:
  save_dir: "runs"
  name: ""
