# Stage B: ramp kappa loss (and optionally hf) after Stage A

seed: 42
device: "auto"

data:
  manifest: "project/data/processed2/manifest.json"
  samples_dir: "project/data/processed2"
  use_dataframe: false
  coord_scale: 1.0
  kappa_meas_scale: 1.0
  allow_placeholder_kappa: false

stats_path: "project/data/processed2/stats.json"

model:
  in_features: 5
  d_model: 128
  n_layers: 4
  dropout: 0.0
  out_coeffs: 16
  encoder_type: "auto"
  embedding_norm: true
  pooling: "mean"

basis:
  M: 4
  N: 4
  Lx: 0.3
  Ly: 1.0

train:
  batch_size: 8
  epochs: 100
  lr: 0.001
  weight_decay: 0.0
  grad_clip: 1.0
  use_kappa_lstsq: true
  lstsq_ridge_lambda: 1e-6
  lstsq_use_mask: true

loss:
  # huber_delta is applied in normalized space (after / std).
  huber_delta: 1.0
  lambda_kappa: 1.0
  lambda_hf: 0.0
  lambda_w: 1.0
  lambda_bc: 0.0
  lambda_delta_a: 1.0e-4
  w_align_mode: "none"
  anchor_mode: "mean"
  lambda_anchor: 0.1
  anchor_index: 0
  kappa_scale_learnable: false
  kappa_scale_init: 1.0
  log_every_n: 100

curriculum:
  enabled: true
  stageA_steps: 0
  stageB_warmup_steps: 2000

run:
  save_dir: "runs"
  name: ""
